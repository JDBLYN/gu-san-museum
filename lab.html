<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>调参台 · 古伞文化馆</title>

  <!-- 用 importmap 引入 Three.js，版本锁定 0.169.0，不装任何包 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
    }

    /* 左侧：调参面板 */
    #panel {
      width: 260px;
      flex: 0 0 260px;
      background: #f4f2ee;
      border-right: 1px solid #ddd8ce;
      padding: 22px 18px;
      overflow-y: auto;
    }

    #panel h1 { font-size: 18px; color: #3a352c; margin-bottom: 4px; }
    #panel .sub { font-size: 12px; color: #8a8374; margin-bottom: 22px; }

    .field { margin-bottom: 20px; }
    .field label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #4a4438;
      margin-bottom: 6px;
    }
    .field label .val { color: #c23b2e; font-weight: 600; }
    .field input[type="range"] { width: 100%; }
    .field input[type="color"] {
      width: 100%;
      height: 32px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }

    /* 导出参数 */
    #export { margin-top: 24px; border-top: 1px solid #ddd8ce; padding-top: 16px; }
    #export .export-actions { display: flex; gap: 8px; margin-bottom: 10px; }
    #export button {
      flex: 1;
      padding: 8px 0;
      border: 1px solid #c23b2e;
      background: #fff;
      color: #c23b2e;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    #export button:hover { background: #c23b2e; color: #fff; }
    #export-output {
      display: none;
      margin: 0;
      padding: 10px;
      background: #2b2b2b;
      color: #e7e2d6;
      font-size: 12px;
      line-height: 1.5;
      border-radius: 4px;
      max-height: 240px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 右侧：3D 展台 */
    #view { flex: 1; position: relative; min-width: 0; }
    #stage {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    #stage:active { cursor: grabbing; }
  </style>
</head>
<body>
  <!-- 左边：滑块面板 -->
  <div id="panel">
    <h1>调参台</h1>
    <p class="sub">拖动滑块，观察右边伞的变化</p>
    <div id="fields"></div>

    <!-- 导出当前参数 -->
    <div id="export">
      <div class="export-actions">
        <button id="export-btn" type="button">导出当前参数</button>
        <button id="copy-btn" type="button">一键复制</button>
      </div>
      <pre id="export-output"></pre>
    </div>
  </div>

  <!-- 右边：3D 伞 -->
  <div id="view">
    <canvas id="stage"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createStage, placeKeyLight } from './src/scene.js';
    import { createUmbrella } from './src/umbrella.js';

    const canvas = document.getElementById('stage');
    const { renderer, scene, camera, keyLight } = createStage(canvas);

    // 鼠标拖动旋转、滚轮缩放
    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0.1, 0);
    controls.enableDamping = true;   // 旋转带一点惯性，手感更顺
    controls.dampingFactor = 0.08;

    // 灯光参数（导出时用）：主光角度、强度
    const lightParams = { angle: 30, intensity: keyLight.intensity };

    // 当前这把伞的参数（初始 = 生成器的默认值）
    const params = {
      ribCount: 24,
      radius: 1.0,
      canopyRise: 0.12,
      openAmount: 1.0,
      handleBottom: -1.0,
      transmission: 0.6,
      roughness: 0.4,
      canopyColor: '#e2b86a',
      // 伞骨/手柄颜色设为白色中性色，让竹纹、木纹原样显示
      colors: { rib: '#ffffff', handle: '#ffffff' },
    };

    // 加载伞骨（竹）和手柄（木）两张贴图，只加载一次，之后每次重建都复用
    const textureLoader = new THREE.TextureLoader();
    const ribTexture = textureLoader.load('assets/textures/bamboo-rib.png');
    const handleTexture = textureLoader.load('assets/textures/wood-handle.png');
    ribTexture.colorSpace = THREE.SRGBColorSpace;   // 颜色按 sRGB 处理，颜色才准
    handleTexture.colorSpace = THREE.SRGBColorSpace;

    let umbrella = null;

    function rebuild() {
      if (umbrella) scene.remove(umbrella);
      umbrella = createUmbrella({
        ...params,
        textures: { rib: ribTexture, handle: handleTexture },
      });
      scene.add(umbrella);
    }

    // 各滑块的说明。
    // 注意：umbrella.js 里没有直接叫“骨长”“中棒长度”的参数，
    // 这里先映射到最接近的参数（详见下方注释）。
    const SLIDERS = [
      // 骨数 → ribCount，直接对应
      { label: '骨数', min: 16, max: 40, step: 1, unit: ' 根',
        value: params.ribCount,
        apply: (v) => { params.ribCount = v; } },

      // 骨长 → radius（伞骨长度 = √(半径² + 伞顶高²)，所以调半径会改变骨长）
      { label: '骨长', min: 0.6, max: 1.6, step: 0.01, unit: '',
        value: params.radius,
        apply: (v) => { params.radius = v; } },

      // 伞面弧垂 → canopyRise，直接对应
      { label: '伞面弧垂', min: 0, max: 0.3, step: 0.01, unit: '',
        value: params.canopyRise,
        apply: (v) => { params.canopyRise = v; } },

      // 开合量 → openAmount，直接对应（0 合拢，1 全开）
      { label: '开合量', min: 0, max: 1, step: 0.01, unit: '',
        value: params.openAmount,
        apply: (v) => { params.openAmount = v; } },

      // 中棒长度 → handleBottom（伞柄下探多远；这里用正数表示长度，越大棒越长）
      { label: '中棒长度', min: 0.5, max: 1.5, step: 0.01, unit: '',
        value: -params.handleBottom,
        apply: (v) => { params.handleBottom = -v; } },

      // 透光率 → transmission，直接对应
      { label: '透光率', min: 0, max: 1, step: 0.01, unit: '',
        value: params.transmission,
        apply: (v) => { params.transmission = v; } },

      // 粗糙度 → roughness，直接对应
      { label: '粗糙度', min: 0, max: 1, step: 0.01, unit: '',
        value: params.roughness,
        apply: (v) => { params.roughness = v; } },

      // 伞面颜色 → canopyColor（用取色器，不是滑块）
      { label: '伞面颜色', type: 'color', unit: '',
        value: params.canopyColor,
        apply: (v) => { params.canopyColor = v; } },

      // 伞骨颜色 → colors.rib（给竹纹理染色）
      { label: '伞骨颜色', type: 'color', unit: '',
        value: params.colors.rib,
        apply: (v) => { params.colors.rib = v; } },

      // —— 下面两个滑块控制灯光（场景），不重建伞 ——

      // 主光角度 → 主光的仰角（0=水平后方，90=正头顶）
      { label: '主光角度', min: 0, max: 90, step: 1, unit: '°',
        value: lightParams.angle, rebuild: false,
        apply: (v) => { lightParams.angle = v; placeKeyLight(keyLight, v); } },

      // 主光强度 → keyLight.intensity
      { label: '主光强度', min: 0, max: 5, step: 0.1, unit: '',
        value: lightParams.intensity, rebuild: false,
        apply: (v) => { lightParams.intensity = v; keyLight.intensity = v; } },
    ];

    const fields = document.getElementById('fields');
    SLIDERS.forEach((s) => {
      const field = document.createElement('div');
      field.className = 'field';

      const label = document.createElement('label');
      const name = document.createElement('span');
      name.textContent = s.label;
      const val = document.createElement('span');
      val.className = 'val';
      val.textContent = s.value + s.unit;
      label.appendChild(name);
      label.appendChild(val);

      const input = document.createElement('input');
      if (s.type === 'color') {
        input.type = 'color';
        input.value = s.value;
        input.addEventListener('input', () => {
          const v = input.value;
          val.textContent = v;
          s.apply(v);
          if (s.rebuild !== false) rebuild();
        });
      } else {
        input.type = 'range';
        input.min = s.min;
        input.max = s.max;
        input.step = s.step;
        input.value = s.value;
        input.addEventListener('input', () => {
          const v = parseFloat(input.value);
          val.textContent = v + s.unit;
          s.apply(v);
          if (s.rebuild !== false) rebuild();
        });
      }

      field.appendChild(label);
      field.appendChild(input);
      fields.appendChild(field);
    });

    // —— 导出当前参数：把当前所有滑块的值整理成 JSON ——
    function buildExportJSON() {
      return {
        ...params,                 // 所有伞参数（含 colors）
        light: { ...lightParams }, // 灯光参数
      };
    }

    const exportOutput = document.getElementById('export-output');
    const exportBtn = document.getElementById('export-btn');
    const copyBtn = document.getElementById('copy-btn');

    exportBtn.addEventListener('click', () => {
      exportOutput.textContent = JSON.stringify(buildExportJSON(), null, 2);
      exportOutput.style.display = 'block';
    });

    copyBtn.addEventListener('click', async () => {
      const json = JSON.stringify(buildExportJSON(), null, 2);
      exportOutput.textContent = json;
      exportOutput.style.display = 'block';
      try {
        await navigator.clipboard.writeText(json);
        copyBtn.textContent = '已复制 ✓';
      } catch (err) {
        copyBtn.textContent = '复制失败，请手动全选';
      }
      setTimeout(() => { copyBtn.textContent = '一键复制'; }, 1500);
    });

    rebuild();

    // 动画循环：每一帧画一次
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // 窗口大小变化时，重新匹配画布尺寸
    function resize() {
      const width = canvas.parentElement.clientWidth;
      const height = canvas.parentElement.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }
    window.addEventListener('resize', resize);

    resize();
    animate();
  </script>
</body>
</html>
