<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>古伞文化馆</title>

  <!-- 用 importmap 引入 Three.js，版本锁定 0.169.0，不装任何包 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --bg: #171a21;     /* 深墨青灰：安静背景 */
      --panel: #1e232c;  /* 面板 */
      --line: #2b313d;   /* 分隔线 */
      --text: #e7e2d6;   /* 暖白文字 */
      --muted: #8f97a3;  /* 次要文字 */
      --accent: #c23b2e; /* 朱砂红：唯一强调色 */

      /* —— 两块信息面板共用的一套（左目录 + 下解说，看起来是一家）—— */
      --font: "Noto Serif SC", "Songti SC", "SimSun", serif;
      --fs-body: 14px;   /* 正文一级。以后「调大一号字」只改这一个 */
      --fs-title: calc(var(--fs-body) + 2px); /* 名字/标题一级，始终比正文大 2px */
      --lh: 1.7;         /* 行距 */
      --radius: 6px;     /* 圆角 */
      --border-w: 1px;   /* 边框粗细 */
      --indicator-w: 2px; /* 选中态指示条粗细 */

      /* —— 密度：目录紧凑扫读，解说宽松细读，只差间距 —— */
      --gap-compact: 6px;       /* 目录项之间的间距 */
      --pad-compact: 10px 14px; /* 目录按钮的内边距 */
      --gap-relaxed: 18px;      /* 解说条目之间的间距 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    /* 顶部：只放馆名 */
    header {
      padding: 18px 28px;
      font-size: 20px;
      letter-spacing: 0.35em;
      border-bottom: 1px solid var(--line);
    }

    /* 中间：左目录 + 3D 展台 */
    main {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 0;
    }

    /* 左侧：伞目录（内容由 app.js 从数据文件生成） */
    #catalog {
      border-right: var(--border-w) solid var(--line);
      padding: 24px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--gap-compact);
    }

    #catalog button {
      background: none;
      border: none;
      border-left: var(--indicator-w) solid transparent; /* 预留选中指示条，不选中时透明 */
      color: var(--muted);
      text-align: left;
      font-family: inherit;
      font-size: var(--fs-title);
      padding: var(--pad-compact);
      cursor: pointer;
      letter-spacing: 0.08em;
    }

    #catalog button:hover { color: var(--text); }
    #catalog button.active {
      color: var(--accent);
      border-left-color: var(--accent);
    }

    /* 中间：3D 展台（伞画在这个 canvas 上） */
    #stage-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    /* 背景层：hall-bg 压暗 + 虚化，垫在 3D 下面，绝不抢伞 */
    #stage-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url('assets/misc/hall-bg.png');
      background-size: cover;
      background-position: center;
      filter: blur(10px) brightness(0.4);
    }

    #stage {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    #stage:active { cursor: grabbing; }

    /* 右下角：两个控制（开合、纹样） */
    #controls {
      position: absolute;
      z-index: 2;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(30, 35, 44, 0.85);
      border: 1px solid var(--line);
      border-radius: 6px;
      min-width: 190px;
    }

    #controls label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.15em;
    }

    #controls input[type="range"] { width: 100%; }

    #controls select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 13px;
    }

    /* 底部：文化解说区（三个标签页） */
    footer {
      border-top: var(--border-w) solid var(--line);
      height: 360px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 10px 28px 0;
      border-bottom: var(--border-w) solid var(--line);
      flex-shrink: 0;
    }

    .tab {
      background: none;
      border: none;
      border-bottom: var(--indicator-w) solid transparent; /* 选中指示条 */
      color: var(--muted);
      font-family: inherit;
      font-size: var(--fs-title);
      padding: 8px 18px;
      cursor: pointer;
      letter-spacing: 0.2em;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .panels {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 28px;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* 形制、纹样：一条条带小标题的说明 */
    .fact { margin-bottom: var(--gap-relaxed); }
    .fact h3 {
      font-size: var(--fs-title);
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.2em;
      margin-bottom: 6px;
    }
    .fact p {
      font-size: var(--fs-body);
      line-height: var(--lh);
      max-width: 720px;
    }

    /* 工艺：8 个步骤排成一行，可横向滚动 */
    .craft-steps {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .craft-step {
      flex: 0 0 200px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .craft-step img {
      width: 100%;
      height: 130px;
      object-fit: contain;
      background: var(--panel);
      border: var(--border-w) solid var(--line);
      border-radius: var(--radius);
    }
    .craft-step h3 {
      font-size: var(--fs-title);
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.2em;
    }
    .craft-step p {
      font-size: var(--fs-body);
      line-height: var(--lh);
    }

    /* ============ 移动端：改成上下布局（桌面端样式一律不动）============ */
    @media (max-width: 768px) {
      /* 整页不再锁死一屏，改成自然往下滚 */
      body {
        height: auto;
        min-height: 100vh;
        grid-template-rows: auto auto auto;
      }

      header {
        padding: 12px 16px;
        font-size: 16px;
        letter-spacing: 0.25em;
      }

      /* 中间由「左右」改成「上下」：目录横排在上，3D 在下 */
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
      }

      /* 目录：从左侧竖排，改成顶部一条可横向滚动的条 */
      #catalog {
        border-right: none;
        border-bottom: var(--border-w) solid var(--line);
        padding: 8px 12px;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        gap: var(--gap-compact);
      }
      #catalog button {
        flex: 0 0 auto;             /* 每项按自己宽度排，不拉伸 */
        white-space: nowrap;        /* 伞名一行显示，不换行 */
        border-left: none;          /* 去掉左边的指示条 */
        border-bottom: var(--indicator-w) solid transparent; /* 指示条改到下方 */
      }
      #catalog button.active {
        border-bottom-color: var(--accent);
      }

      /* 3D 区：给一个明确高度，让伞在首屏看得见 */
      #stage-wrap {
        height: 56vh;
        min-height: 320px;
      }

      /* 控制条：钉在 3D 区底部，往角落收一点 */
      #controls {
        right: 12px;
        bottom: 12px;
        min-width: 168px;
        padding: 12px 14px;
        gap: 10px;
      }

      /* 解说：不锁 360px，改成内容自然高度，随页面往下滚 */
      footer {
        height: auto;
        min-height: 240px;
      }
      .tabs { padding: 8px 16px 0; }
      .panels { padding: 16px; }
    }
  </style>
</head>
<body>
  <header>古伞文化馆</header>

  <main>
    <!-- 左侧伞目录：由 app.js 循环渲染，不在这里写任何伞名 -->
    <aside id="catalog"></aside>

    <!-- 中间 3D 展台 + 右下角控制 -->
    <section id="stage-wrap">
      <div id="stage-bg"></div>
      <canvas id="stage"></canvas>
      <div id="controls">
        <label>
          <span>开合</span>
          <input type="range" id="open-slider" min="0" max="1" step="0.01" value="1" />
        </label>
        <label>
          <span>纹样</span>
          <select id="pattern-select"></select>
        </label>
      </div>
    </section>
  </main>

  <!-- 底部文化解说：三个标签页，内容由 app.js 从数据文件填充 -->
  <footer id="culture">
    <nav class="tabs">
      <button class="tab active" data-tab="form">形制</button>
      <button class="tab" data-tab="craft">工艺</button>
      <button class="tab" data-tab="pattern">纹样</button>
    </nav>
    <div class="panels">
      <div class="panel active" id="panel-form"></div>
      <div class="panel" id="panel-craft"></div>
      <div class="panel" id="panel-pattern"></div>
    </div>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
