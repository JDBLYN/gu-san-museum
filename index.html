<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>古伞文化馆</title>

  <!-- 用 importmap 引入 Three.js，版本锁定 0.169.0，不装任何包 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --bg: #171a21;     /* 深墨青灰：安静背景 */
      --panel: #1e232c;  /* 面板 */
      --line: #2b313d;   /* 分隔线 */
      --text: #e7e2d6;   /* 暖白文字 */
      --muted: #8f97a3;  /* 次要文字 */
      --accent: #c23b2e; /* 朱砂红：唯一强调色 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    /* 顶部：只放馆名 */
    header {
      padding: 18px 28px;
      font-size: 20px;
      letter-spacing: 0.35em;
      border-bottom: 1px solid var(--line);
    }

    /* 中间：左目录 + 3D 展台 */
    main {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 0;
    }

    /* 左侧：伞目录（内容由 app.js 从数据文件生成） */
    #catalog {
      border-right: 1px solid var(--line);
      padding: 24px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #catalog button {
      background: none;
      border: none;
      color: var(--muted);
      text-align: left;
      font-family: inherit;
      font-size: 16px;
      padding: 10px 14px;
      cursor: pointer;
      letter-spacing: 0.08em;
    }

    #catalog button:hover { color: var(--text); }
    #catalog button.active {
      color: var(--accent);
      border-left: 2px solid var(--accent);
    }

    /* 中间：3D 展台（伞画在这个 canvas 上） */
    #stage-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    /* 背景层：hall-bg 压暗 + 虚化，垫在 3D 下面，绝不抢伞 */
    #stage-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url('assets/misc/hall-bg.png');
      background-size: cover;
      background-position: center;
      filter: blur(10px) brightness(0.4);
    }

    #stage {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    #stage:active { cursor: grabbing; }

    /* 右下角：两个控制（开合、纹样） */
    #controls {
      position: absolute;
      z-index: 2;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(30, 35, 44, 0.85);
      border: 1px solid var(--line);
      border-radius: 6px;
      min-width: 190px;
    }

    #controls label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.15em;
    }

    #controls input[type="range"] { width: 100%; }

    #controls select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 13px;
    }

    /* 底部：文化解说区（三个标签页） */
    footer {
      border-top: 1px solid var(--line);
      height: 360px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 10px 28px 0;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .tab {
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 15px;
      padding: 8px 18px;
      cursor: pointer;
      letter-spacing: 0.2em;
      border-bottom: 2px solid transparent;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .panels {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 28px;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* 形制、纹样：一条条带小标题的说明 */
    .fact { margin-bottom: 18px; }
    .fact h3 {
      font-size: 13px;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.2em;
      margin-bottom: 6px;
    }
    .fact p {
      font-size: 14px;
      line-height: 1.8;
      max-width: 720px;
    }

    /* 工艺：8 个步骤排成一行，可横向滚动 */
    .craft-steps {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .craft-step {
      flex: 0 0 200px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .craft-step img {
      width: 100%;
      height: 130px;
      object-fit: contain;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .craft-step h3 {
      font-size: 14px;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.2em;
    }
    .craft-step p {
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>古伞文化馆</header>

  <main>
    <!-- 左侧伞目录：由 app.js 循环渲染，不在这里写任何伞名 -->
    <aside id="catalog"></aside>

    <!-- 中间 3D 展台 + 右下角控制 -->
    <section id="stage-wrap">
      <div id="stage-bg"></div>
      <canvas id="stage"></canvas>
      <div id="controls">
        <label>
          <span>开合</span>
          <input type="range" id="open-slider" min="0" max="1" step="0.01" value="1" />
        </label>
        <label>
          <span>纹样</span>
          <select id="pattern-select"></select>
        </label>
      </div>
    </section>
  </main>

  <!-- 底部文化解说：三个标签页，内容由 app.js 从数据文件填充 -->
  <footer id="culture">
    <nav class="tabs">
      <button class="tab active" data-tab="form">形制</button>
      <button class="tab" data-tab="craft">工艺</button>
      <button class="tab" data-tab="pattern">纹样</button>
    </nav>
    <div class="panels">
      <div class="panel active" id="panel-form"></div>
      <div class="panel" id="panel-craft"></div>
      <div class="panel" id="panel-pattern"></div>
    </div>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
