<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>古伞文化馆</title>

  <!-- 用 importmap 引入 Three.js，版本锁定 0.169.0，不装任何包 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --bg: #171a21;     /* 深墨青灰：安静背景 */
      --panel: #1e232c;  /* 面板 */
      --line: #2b313d;   /* 分隔线 */
      --text: #e7e2d6;   /* 暖白文字 */
      --muted: #8f97a3;  /* 次要文字 */
      --accent: #c23b2e; /* 朱砂红：唯一强调色 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }

    /* 顶部：只放馆名 */
    header {
      padding: 18px 28px;
      font-size: 20px;
      letter-spacing: 0.35em;
      border-bottom: 1px solid var(--line);
    }

    /* 中间：左目录 + 3D 展台 */
    main {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 0;
    }

    /* 左侧：伞目录（内容由 app.js 从数据文件生成） */
    #catalog {
      border-right: 1px solid var(--line);
      padding: 24px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #catalog button {
      background: none;
      border: none;
      color: var(--muted);
      text-align: left;
      font-family: inherit;
      font-size: 16px;
      padding: 10px 14px;
      cursor: pointer;
      letter-spacing: 0.08em;
    }

    #catalog button:hover { color: var(--text); }
    #catalog button.active {
      color: var(--accent);
      border-left: 2px solid var(--accent);
    }

    /* 中间：3D 展台（伞画在这个 canvas 上） */
    #stage-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    #stage {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    #stage:active { cursor: grabbing; }

    /* 右下角：两个控制（开合、纹样） */
    #controls {
      position: absolute;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(30, 35, 44, 0.85);
      border: 1px solid var(--line);
      border-radius: 6px;
      min-width: 190px;
    }

    #controls label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.15em;
    }

    #controls input[type="range"] { width: 100%; }

    #controls select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>古伞文化馆</header>

  <main>
    <!-- 左侧伞目录：由 app.js 循环渲染，不在这里写任何伞名 -->
    <aside id="catalog"></aside>

    <!-- 中间 3D 展台 + 右下角控制 -->
    <section id="stage-wrap">
      <canvas id="stage"></canvas>
      <div id="controls">
        <label>
          <span>开合</span>
          <input type="range" id="open-slider" min="0" max="1" step="0.01" value="1" />
        </label>
        <label>
          <span>纹样</span>
          <select id="pattern-select"></select>
        </label>
      </div>
    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
